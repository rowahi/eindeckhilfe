<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f5d50"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg?v=2">
<title>Eindeckhilfe</title><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1f2a26;--mut:#6b7570;--ac:#2f5d50;--ac2:#e3ede7;--bd:#dcd8cf;--warn:#b4531a;--on:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#161b19;--card:#212825;--tx:#eceee9;--mut:#9aa59f;--ac:#7fc2a8;--ac2:#2a3832;--bd:#33403a;--warn:#f0a060;--on:#12201a}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(64px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:12px}
.hero{border-radius:14px;margin-bottom:12px;min-height:72px;background:var(--ac) center/cover;color:#fff;display:flex;align-items:flex-end;padding:12px;font-weight:700;font-size:1.25rem;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.ampel{border-left:10px solid var(--g)}details{margin-top:8px}summary{cursor:pointer;color:var(--mut);padding:8px 0}
button,input,select{min-height:46px}input[type=checkbox]{min-height:0;width:20px;height:20px;vertical-align:middle}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.dt1{margin:6px 0 2px;display:flex;align-items:center;gap:8px}.dt1 span{font-size:.85rem;color:var(--mut);white-space:nowrap}.dt1 b{min-width:4.6em;text-align:center}.dt1 button{width:40px;height:36px;padding:0;font-size:1.3rem;line-height:1;flex:0 0 auto}.dt1 button:disabled{opacity:.35}
.dt{display:grid;grid-template-columns:2.2rem minmax(0,1fr) 6.2rem;gap:6px;align-items:center;margin-top:6px}.dt select,.dt input{min-height:42px;padding:6px 8px;font-size:.9rem;min-width:0}.dt span{font-size:.85rem;color:var(--mut)}.tile.wide{grid-column:1/-1}
h2{margin:0 0 8px;font-size:1.05rem}label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 3px}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:9px;background:var(--bg)}
input[type=checkbox]{width:auto;margin-right:6px}
button{background:var(--ac);color:var(--on);border:0;border-radius:9px;padding:9px 14px;cursor:pointer}
button.s{background:var(--ac2);color:var(--tx)}button.d{background:var(--warn);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.row>*{flex:1}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big{font-size:1.6rem;font-weight:700;margin:2px 0}.mut{color:var(--mut);font-size:.9rem}
.tag{display:inline-block;background:var(--ac2);border-radius:20px;padding:2px 10px;font-size:.8rem;margin:2px 4px 2px 0}
.warn{color:var(--warn)}ul{padding-left:18px;margin:6px 0}
.tile{border:1px solid var(--bd);border-radius:12px;padding:8px 10px;background:var(--bg);cursor:pointer;min-width:0}.trow{display:flex;align-items:center;gap:8px}.trow .tx{flex:1;min-width:0}.hs{flex:0 0 72px;width:72px;height:50px}.hz{display:flex;flex-direction:column;align-items:center;flex:0 0 72px}.shoes{display:inline-flex;gap:2px;flex:0 0 auto}.shoes svg{width:13px;height:12px;fill:var(--bd)}.shoes svg.on{fill:#b8862b}.tile .tb.nm{white-space:normal;overflow:visible;font-size:.95rem}.gsc{overflow-x:auto;-webkit-overflow-scrolling:touch}.stk{display:grid;grid-template-columns:1fr;gap:8px}.tile.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset}
.tile b{font-size:.9rem}.tile .tl{display:flex;align-items:center;gap:6px}.tile .ic{font-size:1.3rem;margin-right:6px}.tile .tb{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:.85rem;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.tile .tb i{flex:0 0 10px;height:10px;border-radius:50%}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chips button{flex:0 1 auto;min-height:38px;padding:6px 10px;font-size:.85rem}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:14px 4px}nav button.on{color:var(--ac);font-weight:700}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}
.it:first-of-type{border-top:0}.it select{width:auto}
</style></head><body><main>
<section id="v-today"></section><section id="v-blk" hidden></section><section id="v-horse" hidden></section><section id="v-more" hidden></section>
</main>
<nav><button id="t-today" class="on" onclick="tab('today')">Heute</button><button id="t-blk" onclick="tab('blk')">Decken</button><button id="t-horse" onclick="tab('horse')">Pferd</button><button id="t-more" onclick="tab('more')">Mehr</button></nav>
<script>
const $=s=>document.querySelector(s),K='eindeck-v1';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const r1=x=>Math.round(x*2)/2,r0=x=>Math.round(x);
// Modell: Ein Standardpferd (Empfindlichkeit 0) braucht ab BASE °C gefühlt keine Decke.
// Jede Decke hat einen Wärmewert (°C): sie verschiebt diese Grenze nach unten. Ihr Bereich ist BAND °C breit.
const BASE=4,BAND=8;
const insDef=(t,g)=>{g=+g||0;const v=g*.055;return r1(t==='fleece'?Math.max(4,v):t==='sweat'?Math.max(2,v):v)};
const sens=()=>+(S.horse.sens??0);
const bRange=ins=>{const lo=BASE-ins-sens();return[lo,lo+BAND]};
function migrate(){const n=S.none||{minC:14,minL:4};
 S.blankets.forEach(b=>{if(b.ins==null)b.ins=b.minL!=null?r1(Math.max(0,(+n.minL)-b.minL)):insDef(b.type,b.grams);delete b.minC;delete b.maxC;delete b.minL;delete b.maxL});
 const h=S.horse;if(h.sens==null)h.sens=(h.coat==='full'?-10:h.coat==='partial'?-5:0)+(h.cold==='cold'?-3:h.cold==='robust'?3:0);delete h.coat;delete h.cold;delete S.none}
const loc16=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,16);
const nextVisit=()=>{const d=new Date();d.setDate(d.getDate()+1);d.setHours(17,30,0,0);return loc16(d)};
const COLORS={dark:'Dunkel',mid:'Mittel',light:'Hell'},SUNF={dark:1,mid:.7,light:.4};
const TYPES={rain:'Regendecke',outdoor:'Outdoor-Winterdecke',fleece:'Fleece',sweat:'Abschwitzdecke',stable:'Stalldecke',liner:'Liner (für bestimmte Decken)'};
const PLACE={outdoor:'nur draußen',box:'nur Box',both:'draußen & Box'};
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=Object.assign({from:'',sunK:1,vt:'17:30',photo:null,horse:{name:'',sens:0,house:'open',shelter:false},blankets:[],visit:'',loc:null,manual:{minA:0,maxT:8,wind:10,rain:0}},S||{});
S.horse=Object.assign({outT:'07:00',inT:'17:00',boxAdj:1,color:'mid'},S.horse);if(S.horse.house==='paddock')S.horse.house='open';
migrate();
if(!S.visit||new Date(S.visit)<new Date())S.visit=nextVisit();
if(new Date(S.visit).getTime()>Date.now()+72*36e5)S.visit=nextVisit();
S.from=''; // Von beginnt beim Start immer bei jetzt
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let W=null,err='',E=null,G=[];

function tab(n){['today','blk','horse','more'].forEach(x=>{$('#v-'+x).hidden=x!==n;$('#t-'+x).classList.toggle('on',x===n)});
({today:drawToday,blk:drawB,horse:drawH,more:drawM})[n]()}

async function load(){
 if(!S.loc){W=null;err='Noch kein Standort gewählt (Reiter „Mehr“).';return drawToday()}
 err='';
 try{const u=`https://api.open-meteo.com/v1/forecast?latitude=${S.loc.lat}&longitude=${S.loc.lon}&hourly=temperature_2m,apparent_temperature,precipitation,precipitation_probability,wind_speed_10m,shortwave_radiation,cloud_cover&forecast_days=4&timezone=auto`;
  const j=await(await fetch(u)).json();if(!j.hourly)throw 0;W=j.hourly}
 catch(e){W=null;err='Wetter nicht abrufbar (Internet?). Du kannst die Werte manuell eingeben.'}
 drawToday()}

const tmin=t=>{const[a,b]=String(t||'0:0').split(':');return(+a||0)*60+(+b||0)};
function kindAt(d){const h=S.horse;if(h.house==='box')return'box';if(h.house!=='mixed')return'out';
 const o=tmin(h.outT),n=tmin(h.inT),t=d.getHours()*60+d.getMinutes()+30;
 return o<n?(t>=o&&t<n?'out':'box'):(t>=o||t<n?'out':'box')}
const fromBase=()=>S.from?new Date(S.from):new Date();
function nextAt(hhmm,base){const b=base?new Date(base):new Date(),d=new Date(b),[x,y]=hhmm.split(':');d.setHours(+x,+y,0,0);if(d<=b.getTime()+6e4)d.setDate(d.getDate()+1);return d}
function dayWord(d){const t=new Date();t.setHours(0,0,0,0);const n=Math.round((new Date(d).setHours(0,0,0,0)-t)/864e5);return n<=0?'heute':n===1?'morgen':d.toLocaleDateString('de-DE',{weekday:'long'})}
function goAt(hhmm){S.visit=loc16(nextAt(hhmm,fromBase()));save();drawToday()}
function setFrom(v){S.from=v||'';save();drawToday()}
function analyse(a0,b0){
 const v=b0||new Date(S.visit),now=new Date(),f=a0||fromBase();
 if(!(v>now))return{err:'Das Ende des Zeitraums liegt in der Vergangenheit.'};
 if(!(v>f))return{err:'„Von“ liegt nach „Bis“. Bitte den Zeitraum anpassen.'};
 if(!W){const m=S.manual,k=S.horse.house==='box'?['box']:S.horse.house==='mixed'?['out','box']:['out'];
  const base={minA:+m.minA,maxT:+m.maxT,wind:+m.wind,rain:+m.rain,prob:m.rain>0?100:0};
  return{...base,sunMax:0,segs:k.map(x=>({kind:x,...base,n:1,hrs:[{A:base.minA,T:base.maxT,r:0}]})),manual:1}}
 let ix=[];W.time.forEach((t,k)=>{const d=new Date(t);if(d>f-36e5&&d<v)ix.push(k)});
 if(!ix.length)W.time.forEach((t,k)=>{const d=new Date(t);if(d>f-36e5&&d<=v)ix.push(k)});
 if(!ix.length)return{err:'Für diesen Zeitraum gibt es keine Wetterdaten (maximal 3 Tage).'};
 const st=(id,kind)=>{const g=a=>id.map(k=>W[a][k]);
  return{kind,n:id.length,minA:Math.min(...g('apparent_temperature')),maxT:Math.max(...g('temperature_2m')),wind:Math.max(...g('wind_speed_10m')),
   rain:g('precipitation').reduce((a,b)=>a+b,0),prob:Math.max(...g('precipitation_probability').map(x=>x||0)),
   hrs:id.map(k=>({A:W.apparent_temperature[k],T:W.temperature_2m[k],r:kind==='box'?0:(W.shortwave_radiation?W.shortwave_radiation[k]||0:0)}))}};
 const segs=['out','box'].map(kd=>[kd,ix.filter(k=>kindAt(new Date(W.time[k]))===kd)]).filter(x=>x[1].length).map(x=>st(x[1],x[0]));
 const all=st(ix,'all'),sunMax=Math.max(0,...segs.filter(g=>g.kind==='out').flatMap(g=>g.hrs.map(x=>x.r)));
 return{...all,sunMax,segs,ser:ix.map(k=>W.apparent_temperature[k])}}

const lf=b=>({under:b.under??['fleece','sweat','stable'].includes(b.type),over:b.over??!['fleece','sweat'].includes(b.type)});
function recommend(w){
 const h=S.horse,cadj=sens(),badj=+(h.boxAdj??1);
 const segs=w.segs.map(g=>{const box=g.kind==='box',adj=cadj+(box?badj:(h.shelter?0:-2));
  return{...g,box,adj,eMin:g.minA+adj,eMax:g.maxT+adj,wet:!box&&isWet(g.rain,g.prob),windy:!box&&g.wind>=30}});
 const rg=b=>b.none?[BASE,40]:[BASE-b.ins,BASE-b.ins+BAND]; // im Maßstab des Standardpferds (Empfindlichkeit steckt in adj)
 const none={id:0,none:1,name:'Keine Decke',ins:0,waterproof:0,wind:1,place:'both',parts:[],layers:0};
 const baseLo=BASE,I=b=>+b.ins||0;
 const act=S.blankets.filter(b=>b.status==='ok'),liners=act.filter(b=>b.type==='liner'),decks=act.filter(b=>b.type!=='liner');
 // Teile: Decke allein oder Decke mit passendem Liner (zählt als eine Schicht)
 const withLiner=(b,l)=>({...b,name:b.name+' mit '+l.name,grams:(+b.grams||0)+(+l.grams||0),ins:I(b)+I(l),parts:[b.id,l.id],layers:1,base:b,liner:l});
 const pieces=[];decks.forEach(b=>{pieces.push({...b,parts:[b.id],layers:1,base:b});liners.filter(l=>(l.fits||[]).includes(b.id)).forEach(l=>pieces.push(withLiner(b,l)))});
 // Abnehmbares Halsteil: jede solche Decke zusätzlich mit Halsteil (mehr Wärme, besser bei Regen und Wind)
 pieces.slice().forEach(p=>{if(p.base.neck)pieces.push({...p,name:p.name+' mit Halsteil',ins:I(p)+(+(p.base.neckIns??2)),parts:[...p.parts,'n'+p.base.id],neckOn:true})});
 const adds=(x,y)=>I(x)>=2||(x.waterproof&&!y.waterproof)||(x.wind&&!y.wind); // trägt die Decke neben der anderen etwas bei?
 const cand=[none,...pieces];
 pieces.forEach(u=>pieces.forEach(o=>{
  if(u.base.id===o.base.id||u.neckOn||!lf(u.base).under||!lf(o.base).over)return; // Halsteil nur an der Oberdecke
  // beide Decken müssen etwas beitragen (Wärme, Wasser- oder Winddichtigkeit), sonst keine Kombination
  if(!adds(o,u)||!adds(u,o))return;
  if((u.place==='box'&&o.place==='outdoor')||(u.place==='outdoor'&&o.place==='box'))return;
  cand.push({id:'c'+u.id+'-'+o.id,name:u.name+' + '+o.name,type:'combo',grams:(+u.grams||0)+(+o.grams||0),
   ins:I(u)+I(o),
   place:(u.place==='box'||o.place==='box')?'box':(u.place==='outdoor'||o.place==='outdoor')?'outdoor':'both',
   color:o.color,waterproof:o.waterproof,wind:o.wind,neckOn:!!o.neckOn,parts:[...u.parts,...o.parts],layers:2,under:u,over:o})}));
 const evaluate=ss=>{const single=ss.length===1;
  const eMin=Math.min(...ss.map(s=>s.eMin)),eMax=Math.max(...ss.map(s=>s.eMax));
  const ok=b=>b.none||!single||(ss[0].box?b.place!=='outdoor':b.place!=='box');
  return cand.filter(ok).map(b=>{const[lo0,hi]=rg(b);
   const lo=b.none?lo0:Math.min(lo0,baseLo); // eine Decke ist nie kälter als keine Decke
   let cold=0,hot=0,pen=0,top=-99,sc=0,sh=0,mc=0,mh=0,nh=0;
   const F=SUNF[(b.none?h.color:b.color)||'mid'],K=+S.sunK;
   for(const s of ss){
    // Sonne: Gefühlte Temperatur enthält schon einen Mittelwert, daher nur die Abweichung der Farbe; Lufttemperatur bekommt die volle Sonnenwirkung
    // Regen: eine dünne Regendecke (0 g) staut kaum Wärme und passt dann auch bei warmem Wetter
    const hiS=s.wet&&!b.none&&b.waterproof&&I(b)<2?hi+10:hi;
    // Stunde für Stunde: wie weit liegt die gefühlte Temperatur unter bzw. über dem Bereich der Decke?
    for(const x of s.hrs){const cA=x.A+s.adj+(F-.7)*x.r/100*K,cT=x.A+s.adj+F*x.r/100*K,dc=Math.max(0,lo-cA),dh=Math.max(0,cT-hiS);
     top=Math.max(top,cT);sc+=dc;sh+=dh;mc=Math.max(mc,dc);mh=Math.max(mh,dh);nh++}
    if(s.wet&&!b.waterproof)pen+=10;if(s.windy&&!b.wind)pen+=1.5;
    if(!b.none&&!b.neckOn&&s.wet&&s.windy)pen+=.6; // Regen mit Wind: Halsteil hält Hals und Mähne trocken
    if(!single&&(s.box?b.place==='outdoor':b.place==='box'))pen+=2.5}
   // Mischform: zählt hauptsächlich, wie lange und wie stark es zu kalt/zu warm ist (Durchschnitt über die Stunden);
   // sehr kalte Stunden (mehr als 4 °C unter dem Bereich) zählen zusätzlich, sehr warme (über 6 °C) etwas
   if(nh){cold=sc/nh+Math.max(0,mc-4)*.5;hot=sh/nh+Math.max(0,mh-6)*.3}
   const slip=(b.layers===2?.4:0)+(b.neckOn?.3:0); // zwei Schichten können verrutschen; Halsteil ist ein Handgriff mehr
   return{b,lo,hi,cold,hot,pen,sunUp:top-eMax,score:cold*1.5+hot+pen+slip+(b.none?0:.1+Math.abs((lo+hi)/2-(eMin+eMax)/2)*.05)}}).sort((a,b)=>a.score-b.score)};
 const c=evaluate(segs),eMin=Math.min(...segs.map(s=>s.eMin)),eMax=Math.max(...segs.map(s=>s.eMax));
 // Wechselplan: bester Zustand je Abschnitt, mit möglichst wenigen Handgriffen dazwischen
 let plan=null;
 if(segs.length===2){const ev=segs.map(sg=>evaluate([sg]));
  const chg=(a,b)=>{const A=new Set(a.parts),B=new Set(b.parts);return[...A].filter(x=>!B.has(x)).length+[...B].filter(x=>!A.has(x)).length};
  let bt=1e9;for(const a of ev[0])for(const b of ev[1]){const t=a.score+b.score+.7*chg(a.b,b.b);if(t<bt){bt=t;plan={a,b,seg:[segs[0],segs[1]],chg:chg(a.b,b.b)}}}}
 return{best:c[0],alt:c[1],all:c,segs,plan,mixed:segs.length>1,eMin,eMax,wet:segs.some(s=>s.wet),windy:segs.some(s=>s.windy)}}

const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
const amp=(q,span)=>{const bad=!(span>=8)&&(q.pen>=6||q.cold>2.5),mid=q.cold>0||q.hot>2||q.pen>0;return{bad,mid,col:bad?'#c4472f':mid?'#d9a521':'#3a9d5d'}};
// Sicherheit der Wahl als 1–3 Hufeisen
const stars=q=>q.cold>2.5||q.hot>5||q.pen>=6?1:(q.cold>0||q.hot>2||q.pen>0)?2:3;
const SHOE='<path d="M3 13V7a5 5 0 0 1 10 0v6h-2.600V7a2.400 2.400 0 0 0-4.800 0v6z"/>';
function shoes(n){const T=['','unsicher','Kompromiss','passt gut'][n];return`<span class="shoes" title="${T}" aria-label="Sicherheit: ${T}">${[1,2,3].map(i=>`<svg viewBox="0 0 16 14" class="${i<=n?'on':''}">${SHOE}</svg>`).join('')}</span>`}
let SL=[],WHY=false,SHOW=false,ACT=-1; // ACT: -1 = eigener Zeitraum (Von/Bis), sonst Nummer des Halbtags
const isDayAt=d=>{const o=tmin(S.horse.outT),n=tmin(S.horse.inT),t=d.getHours()*60+d.getMinutes();return o<n?(t>=o&&t<n):(t>=o||t<n)};
function slots(N){N=N||3;const o=tmin(S.horse.outT),n=tmin(S.horse.inT),B=[];
 for(let k=-1;k<=4;k++)[[o,1],[n,0]].forEach(([t,day])=>{const d=new Date();d.setDate(d.getDate()+k);d.setHours(Math.floor(t/60),t%60,0,0);B.push({d,day})});
 B.sort((x,y)=>x.d-y.d);const now=new Date();let i=0;B.forEach((x,k)=>{if(x.d<=now)i=k});
 const out=[];if(B[i+1]&&B[i+1].d-now>=45*6e4)out.push({a:now,b:B[i+1].d,day:B[i].day,first:1});
 for(let k=i+1;k<B.length-1&&out.length<N;k++)out.push({a:B[k].d,b:B[k+1].d,day:B[k].day});return out}
const wd=d=>new Date(d).toLocaleDateString('de-DE',{weekday:'long'});
const slotLab=t=>(t.first||dayWord(t.a)==='heute'?'Heute':wd(t.a))+(t.day?' am Tag':' in der Nacht');
const slotFor=t=>t.first&&!t.day?'Diese Nacht':slotLab(t);
// Wetterart eines Zeitabschnitts für das Symbol
// Regen zählt nur, wenn das Pferd draußen ist (gleiche Regel wie bei der Empfehlung)
const isWet=(rain,prob)=>rain>=.3||prob>=60;
function wkind(a,b){if(!W)return'clear';let n=0,rain=0,tm=0,cl=0,pr=0;
 W.time.forEach((t,k)=>{const d=new Date(t);if(d>a-36e5&&d<b&&kindAt(d)!=='box'){n++;rain+=W.precipitation[k]||0;pr=Math.max(pr,(W.precipitation_probability||[])[k]||0);tm+=W.temperature_2m[k];cl+=(W.cloud_cover?W.cloud_cover[k]:0)||0}});
 if(!n)return'clear';tm/=n;cl/=n;return isWet(rain,pr)?(tm<=.5?'snow':'rain'):cl>=75?'cloud':cl>=35?'part':'clear'}
function wico(day,k,z){z=z||30;if(k!=='rain'&&k!=='snow')return'';

const csvLine=a=>a.map(csvq).join(';');
const STATUS={ok:'verfügbar',wash:'in der Wäsche',wet:'nass'};
const COAT={long:'langhaarig',partial:'Teilschur',full:'Vollschur'},COLDL={robust:'robust',normal:'normal',cold:'verfroren'},HOUSE={open:'draußen',box:'Box',mixed:'tagsüber draußen, nachts Box'},SUNL={0:'aus',0.5:'schwach',1:'normal',1.5:'stark'};
const rev=(m,v,d)=>{v=String(v||'').trim().toLowerCase();const k=Object.keys(m).find(k=>k.toLowerCase()===v||String(m[k]).toLowerCase()===v||String(m[k]).toLowerCase().startsWith(v)&&v.length>2);return k??d};
const BH=['Name','Typ','Füllung g','Wärmewert °C','draußen','Box','wasserdicht','winddicht','Halsteil','Halsteil Wärmewert °C','Unterdecke','Oberdecke','Helligkeit','Farbton','Status','Liner passt zu'];
function blanketsCSV(){const nm=i=>(S.blankets.find(x=>x.id===i)||{}).name||'';
 const rows=S.blankets.map(b=>{const L=b.type==='liner',f=lf(b);return[b.name,TYPES[b.type]||b.type,b.grams||0,num(b.ins||0),JN(b.place!=='box'),JN(b.place!=='outdoor'),JN(b.waterproof),JN(b.wind),JN(b.neck),L?'':num(b.neckIns??2),L?'':JN(f.under),L?'':JN(f.over),COLORS[b.color||'mid'],L?'':(b.hex||bcol(b)),STATUS[b.status||'ok'],L?(b.fits||[]).map(nm).filter(Boolean).join(', '):'']});
 return[csvLine(BH),...rows.map(csvLine)].join('\r\n')}
function horseCSV(){const h=S.horse,l=S.loc||{};const R=[['Feld','Wert'],['Name',h.name||''],['Empfindlichkeit',sl(h.sens||0)],['Fellfarbe',COLORS[h.color||'mid']],['Haltung',HOUSE[h.house]||h.house],['Rausbringen um',h.outT||''],['Reinholen um',h.inT||''],['Box wärmer um °C',num(h.boxAdj)],['Unterstand draußen',JN(h.shelter)],
 ['Sonneneinfluss',SUNL[+S.sunK]??num(S.sunK)],['Ort',l.name||''],['Breitengrad',l.lat!=null?num(l.lat):''],['Längengrad',l.lon!=null?num(l.lon):''],['Uhrzeit Stallbesuch',S.vt||'']];
 return R.map(csvLine).join('\r\n')}
function parseCSV(t){t=t.replace(/^﻿/,'');const first=t.split(/\r?\n/)[0]||'',sep=(first.split(';').length>=first.split(',').length)?';':(first.includes('\t')?'\t':',');
 const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;else if(c===sep){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}
 if(f!==''||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()!==''))}
function importBlankets(rows){const H=rows[0].map(x=>x.trim().toLowerCase()),col=n=>H.findIndex(h=>h.startsWith(n.toLowerCase())),g=(r,n)=>{const i=col(n);return i<0?'':(r[i]||'').trim()};
 const out=[],err=[],links=[];let id=Date.now();
 rows.slice(1).forEach((r,k)=>{const name=g(r,'Name');if(!name)return;const z=k+2;
  const type=rev(TYPES,g(r,'Typ'),'rain'),grams=pnum(g(r,'Füllung'))??0,nb=(n,dv)=>{const v=g(r,n);if(v==='')return dv;const x=pnum(v);if(x===null){err.push(`Zeile ${z}: „${n}“ ist keine Zahl (${v})`);return dv}return x};
  const o=g(r,'draußen'),bx=g(r,'Box'),po=o===''?true:isJ(o),pb=bx===''?true:isJ(bx);
  const b={id:id++,name,type,grams,ins:nb('Wärmewert',insDef(type,grams)),place:po&&pb||(!po&&!pb)?'both':po?'outdoor':'box',color:rev(COLORS,g(r,'Helligkeit'),'mid'),waterproof:isJ(g(r,'wasserdicht')),wind:isJ(g(r,'winddicht')),neck:isJ(g(r,'Halsteil')),neckIns:nb('Halsteil Wärmewert',2),status:rev(STATUS,g(r,'Status'),'ok')};
  if(type!=='liner'){const u=g(r,'Unterdecke'),v=g(r,'Oberdecke');if(u!=='')b.under=isJ(u);if(v!=='')b.over=isJ(v);const hx=g(r,'Farbton');if(/^#[0-9a-f]{6}$/i.test(hx))b.hex=hx}
  else{b.fits=[];links.push([b,g(r,'Liner passt zu')])}
  out.push(b)});
 links.forEach(([b,t])=>t.split(/[,|]/).map(x=>x.trim().toLowerCase()).filter(Boolean).forEach(n=>{const m=out.find(x=>x.type!=='liner'&&x.name.toLowerCase()===n);m?b.fits.push(m.id):err.push(`Liner „${b.name}“: Decke „${n}“ nicht gefunden`)}));
 return{out,err}}
function importHorse(rows){const m={};rows.slice(1).forEach(r=>{if(r[0])m[r[0].trim().toLowerCase()]=(r[1]||'').trim()});const g=n=>{const k=Object.keys(m).find(k=>k.startsWith(n.toLowerCase()));return k?m[k]:''};
 const h=S.horse,err=[],nb=(n,cur)=>{const v=g(n);if(v==='')return cur;const x=pnum(v);if(x===null){err.push(`„${n}“ ist keine Zahl (${v})`);return cur}return x};
 if(g('Name'))h.name=g('Name');h.sens=Math.max(-20,Math.min(10,nb('Empfindlichkeit',h.sens)));h.color=rev(COLORS,g('Fellfarbe'),h.color);h.house=rev(HOUSE,g('Haltung'),h.house);
 const tm=v=>/^\d{1,2}:\d{2}$/.test(v)?v.padStart(5,'0'):null;h.outT=tm(g('Rausbringen'))||h.outT;h.inT=tm(g('Reinholen'))||h.inT;h.boxAdj=nb('Box wärmer',h.boxAdj);if(g('Unterstand'))h.shelter=isJ(g('Unterstand'));
 const sk=g('Sonneneinfluss');if(sk){const k=Object.keys(SUNL).find(k=>SUNL[k]===sk.toLowerCase());S.sunK=k!=null?+k:(pnum(sk)??S.sunK)}
 const la=pnum(g('Breitengrad')),lo=pnum(g('Längengrad'));if(la!==null&&lo!==null)S.loc={lat:la,lon:lo,name:g('Ort')||'Ort'};
 const vt=tm(g('Uhrzeit Stallbesuch'));if(vt)S.vt=vt;return{err}}
const csvFile=(n,t)=>new File(['﻿'+t],n,{type:'text/csv'});
function dl(n,t){const u=URL.createObjectURL(new Blob(['﻿'+t],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function csvmsg(t,bad){const m=$('#csvmsg');if(m){m.innerHTML=t;m.className=bad?'warn':'mut'}}
function expB(){dl('decken.csv',blanketsCSV());csvmsg(S.blankets.length+' Decken als decken.csv gespeichert (Ordner Downloads).')}
function expH(){dl('pferd.csv',horseCSV());csvmsg('Pferd und Einstellungen als pferd.csv gespeichert (Ordner Downloads).')}
async function shareCSV(){const f=[csvFile('decken.csv',blanketsCSV()),csvFile('pferd.csv',horseCSV())];
 try{if(navigator.canShare&&navigator.canShare({files:f})){await navigator.share({files:f,title:'Eindeckhilfe Daten'});return}}catch(e){if(e&&e.name==='AbortError')return}
 expB();expH();csvmsg('Teilen ist hier nicht möglich, die Dateien wurden stattdessen gespeichert.')}
function impCSV(inp){const fs=[...inp.files];inp.value='';if(!fs.length)return;let msgs=[],errs=[];
 Promise.all(fs.map(f=>f.text().then(t=>[f.name,t]))).then(list=>{
  const kinds=list.map(([n,t])=>{const rows=parseCSV(t);if(!rows.length)return[n,null,rows];const h=rows[0].map(x=>x.trim().toLowerCase());return[n,h[0]==='feld'?'horse':h.includes('name')&&h.some(x=>x.startsWith('typ'))?'blk':null,rows]});
  const nb=kinds.filter(k=>k[1]==='blk').reduce((a,k)=>a+k[2].length-1,0);
  if(nb&&!confirm(`Deine Deckenliste wird durch ${nb} Decke(n) aus der Datei ersetzt. Fortfahren?`))return;
  kinds.forEach(([n,k,rows])=>{
   if(k==='blk'){const R=importBlankets(rows);if(R.out.length){S.blankets=R.out;msgs.push(`${R.out.length} Decken aus ${esc(n)} übernommen`)}else errs.push(`${esc(n)}: keine Decken gefunden`);errs.push(...R.err.map(esc))}
   else if(k==='horse'){const R=importHorse(rows);msgs.push(`Pferd und Einstellungen aus ${esc(n)} übernommen`);errs.push(...R.err.map(esc))}
   else errs.push(`${esc(n)}: unbekanntes Format (erste Spalte muss „Name“ bzw. „Feld“ heißen)`)});
  save();csvmsg((msgs.length?msgs.join('.<br>')+'.':'')+(errs.length?'<br><span class="warn">Hinweise:<br>'+errs.join('<br>')+'</span>':''),!msgs.length);
  if(msgs.some(m=>m.includes('Einstellungen')))load()}).catch(()=>csvmsg('Datei konnte nicht gelesen werden.',1))}

function hero(){const p=S.photo;return`<div class="hero" style="${p?`background-image:linear-gradient(transparent 40%,rgba(0,0,0,.55)),url('${p}');min-height:150px`:''}">${esc(S.horse.name||'Eindeckhilfe')}</div>`}
function rem(){const m=new Date(S.visit)-fromBase();if(m<=0)return'';return`<p class="mut">Zeitraum: ${Math.floor(m/36e5)} h ${Math.round(m%36e5/6e4)} min</p>`}
function tmr(){const d=new Date(fromBase()),[a,b]=S.vt.split(':');d.setDate(d.getDate()+1);d.setHours(+a,+b,0,0);S.visit=loc16(d);save();drawToday()}
function photo(f){if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,700/im.width);c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.photo=c.toDataURL('image/jpeg',.75);save();drawH();URL.revokeObjectURL(im.src)};im.src=URL.createObjectURL(f)}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
load();
</script></body></html>
